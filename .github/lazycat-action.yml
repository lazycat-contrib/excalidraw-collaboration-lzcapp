version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/excalidraw-collaboration.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: excalidraw

build:
  run_buildscript: false

images:
  - id: excalidraw
    target: service
    service: frontend
    source: alswl/excalidraw
    channel: stable
    sort: semver
    tag_regex: '^v?[0-9]+\.[0-9]+\.[0-9]+-fork-b[0-9]+$'
    version_regex: '^v?(?P<version>[0-9]+\.[0-9]+\.[0-9]+)-fork-b[0-9]+$'
    version_template: '{version}'
    delivery:
      mode: mirror
      image_template: docker.1ms.run/alswl/excalidraw:{tag}
      require_digest_match: true

  - id: storage-backend
    target: service
    service: storage
    source: alswl/excalidraw-storage-backend
    channel: stable
    sort: semver
    tag_regex: '^v?[0-9]{4}\.[0-9]+\.[0-9]+$'
    delivery:
      mode: mirror
      image_template: docker.1ms.run/alswl/excalidraw-storage-backend:{tag}
      require_digest_match: true

  - id: room-go
    target: service
    service: room
    source: alswl/excalidraw-room-go
    channel: stable
    sort: semver
    tag_regex: '^v?[0-9]+\.[0-9]+\.[0-9]+$'
    delivery:
      mode: mirror
      image_template: docker.1ms.run/alswl/excalidraw-room-go:{tag}
      require_digest_match: true

stores:
  official:
    enabled: false
    skip_if_version_exists: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Excalidraw Collaboration
    summary: 可私有部署的 Excalidraw 实时协作白板
